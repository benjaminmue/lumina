<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="180" y1="140" x2="860" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2841"/>
      <stop offset="0.55" stop-color="#151F35"/>
      <stop offset="1" stop-color="#0F1626"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="512" cy="500" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9D0FF" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#7DB7FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7DB7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dotCore" cx="466" cy="450" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E2F0FF"/>
      <stop offset="1" stop-color="#8BB9F2"/>
    </radialGradient>
    <linearGradient id="sideDot" x1="0" y1="440" x2="0" y2="584" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C4DAF6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#8FB0DC" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="topGlass" x1="512" y1="0" x2="512" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="400" fill="url(#topGlass)"/>

    <circle cx="512" cy="500" r="280" fill="url(#dotGlow)"/>
    <circle cx="512" cy="500" r="156" fill="url(#dotCore)"/>
    <circle cx="512" cy="500" r="156" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>

    <circle cx="236" cy="512" r="60" fill="url(#sideDot)"/>
    <circle cx="236" cy="512" r="60" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="788" cy="512" r="60" fill="url(#sideDot)"/>
    <circle cx="788" cy="512" r="60" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
  </g>
  <rect x="1" y="1" width="1022" height="1022" rx="223" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
</svg>
