name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, z.B. 1.2.0"
        required: true

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install libwebp
        run: brew install webp

      - name: Install dmgbuild
        # Schreibt das Fenster-Layout direkt ins .DS_Store. Über den Finder ginge
        # es hier nicht: auf dem Runner läuft keiner.
        run: pipx install dmgbuild

      - name: Test
        run: swift test

      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - name: Sign update and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY fehlt. Ohne Signatur lehnt Sparkle jedes Update ab."
            exit 1
          fi
          # Der Schlüssel liegt nur für diesen Schritt auf der Platte.
          KEYFILE="$(mktemp)"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT

          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="${{ github.event.inputs.version }}"
          ./scripts/make-appcast.sh "dist/Lumina-$VERSION.dmg" "$KEYFILE"

      - name: Collect release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="${{ github.event.inputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Abschnitt der Version aus dem Changelog schneiden.
          awk -v v="## $VERSION" '
            $0 ~ "^" v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          # Der Installationshinweis gehört in jede Veröffentlichung: ohne ihn
          # landet die App bei den meisten Leuten im Papierkorb statt im Dock.
          # Als eigene Datei, weil ein "---" am Zeilenanfang sonst die YAML-Datei
          # zerlegt - GitHub liest es als Beginn eines zweiten Dokuments.
          cat .github/install-note.md >> release-notes.md

          cat release-notes.md

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # Der Feed muss mit ins Release: die App fragt ihn unter
          # releases/latest/download/appcast.xml ab.
          files: |
            dist/*.dmg
            dist/appcast.xml
          body_path: release-notes.md
          name: Lumina ${{ steps.notes.outputs.version }}
